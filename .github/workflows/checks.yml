name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: lila-adapter/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: lila-adapter
      - run: npm test
        working-directory: lila-adapter
      - run: node analysis/test-client.mjs
      - run: node --experimental-vm-modules --no-warnings analysis/test-worker.mjs
      - run: node learning/test-import.mjs
      - name: Parse runtime JavaScript and build the browser login
        run: |
          node --check deploy/public/gateway.mjs
          node --check deploy/calibration/database.js
          node deploy/public/test-nostr.mjs
          node --check lila-adapter/server.mjs
          node --check lila-adapter/study.mjs
          node --check lila-adapter/test/study-integration.mjs
          node lila-adapter/build-browser.mjs /tmp/nosweat-nostr.js
          node --check /tmp/nosweat-nostr.js
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: python -m pip install -r worker/requirements.txt
      - name: Encoder regression without external weights
        working-directory: lila-adapter
        run: PYTHONPATH=.:test python -m unittest test_worker.WorkerTests.test_history_and_black_orientation test_worker.WorkerTests.test_deterministic_temperature_and_top_p_zero_endpoints test_strength_predictor
      - run: python -m unittest discover -s puzzles
      - run: python -m unittest discover -s learning
      - name: Parse deployment Python
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('deploy', 'scripts', 'puzzles', 'learning'):
              for source in Path(directory).rglob('*.py'):
                  ast.parse(source.read_text(), filename=str(source))
          PY
      - name: Service boundary contracts
        run: python -m unittest discover -s deploy/public -p 'test_*.py'
      - name: Reproduce frozen continuous experiment design
        run: |
          python deploy/study/design.py --output /tmp/strength-design
          cmp /tmp/strength-design/experiment-roster.json lila-adapter/experiment-roster.json
          cmp /tmp/strength-design/experiment-manifest.json lila-adapter/experiment-manifest.json
      - name: Catalog data is reproducible
        run: |
          node lila-adapter/generate-catalog.mjs
          git diff --exit-code -- lila-adapter/catalog-roster.json lila-adapter/catalog-aliases.json docs/data/catalog-2026-11-01/catalog-manifest.json
      - name: Documented upstream departures
        run: |
          python deploy/lila/check-upstream.py
          python -m unittest discover -s deploy/lila -p 'test_*.py'
  upstream-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Apply native patches to their exact upstream revisions
        run: |
          git init /tmp/lila
          git -C /tmp/lila fetch --depth=1 https://github.com/lichess-org/lila.git b551752d2a0e7a63459d9812825d95a633a98737
          git -C /tmp/lila checkout --detach FETCH_HEAD
          git -C /tmp/lila apply "$GITHUB_WORKSPACE/deploy/lila/patches/lila-nostr-maia.patch"
          python "$GITHUB_WORKSPACE/deploy/public/native-source.py" /tmp/lila > /tmp/lila-reconstructed.patch
          cmp /tmp/lila-reconstructed.patch "$GITHUB_WORKSPACE/deploy/lila/patches/lila-nostr-maia.patch"
          git init /tmp/lila-ws
          git -C /tmp/lila-ws fetch --depth=1 https://github.com/lichess-org/lila-ws.git 5089b84b5fe2da3f3e9e69d29363115cfddfc758
          git -C /tmp/lila-ws checkout --detach FETCH_HEAD
          git -C /tmp/lila-ws apply --check "$GITHUB_WORKSPACE/deploy/lila/patches/lila-ws-bind-address.patch"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Native and adapter catalogs agree
        run: node lila-adapter/validate-catalog.mjs /tmp/lila
      - name: Build and test the native board and analysis extensions
        working-directory: /tmp/lila
        run: |
          npm install --global pnpm@12.9.0
          pnpm install --frozen-lockfile
          (cd ui/.build && pnpm install --frozen-lockfile)
          node "$GITHUB_WORKSPACE/puzzles/validate.mjs" /tmp/lila/node_modules/.pnpm/chessops@0.15.1/node_modules/chessops
          node ui/test
          ./ui/build --no-install site lobby analyse round editor dasher puzzle bits learn coordinateTrainer storm user

  native-forum:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare the pinned native forum sources
        run: |
          git init /tmp/lila
          git -C /tmp/lila fetch --depth=1 https://github.com/lichess-org/lila.git b551752d2a0e7a63459d9812825d95a633a98737
          git -C /tmp/lila checkout --detach FETCH_HEAD
          git -C /tmp/lila apply "$GITHUB_WORKSPACE/deploy/lila/patches/lila-nostr-maia.patch"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
          cache-dependency-path: deploy/lila/patches/lila-nostr-maia.patch
      - uses: sbt/setup-sbt@f9efdb0d6d5959d3e1510935d4ff64a65821a256 # v1
      - name: Check native Scala formatting, GIF parsing, study plan, forum permissions and user search
        working-directory: /tmp/lila
        run: sbt -J-Xms128m -J-Xmx3g -J-Xss2m -J-XX:ActiveProcessorCount=2 -Dsbt.task.cpus=2 -Dsbt.supershell=false 'scalafmtCheckAll;game/testOnly lila.game.NoSweatAnalysisGifTest;bot/testOnly lila.bot.PublicBotActivityTest;compile;forum/testOnly lila.forum.ForumAccessTest;user/testOnly lila.user.NoSweatUserSearchTest;user/testOnly lila.user.NoSweatPlayerRatingsTest;testOnly lila.app.NoSweatStudyPlanTest;testOnly lila.app.NoSweatBotCatalogTest;user/testOnly lila.user.NoSweatBotIdentityTest'


  native-gif:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare pinned native renderer generation tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 install resvg --version 0.45.1 --locked --root /tmp/mute-gif-tools
          echo /tmp/mute-gif-tools/bin >> "$GITHUB_PATH"
          python -m pip install numpy==2.2.6 Pillow==11.3.0
      - name: Build the exact official renderer with the reviewed moss extension
        run: |
          git init /tmp/lila-gif
          git -C /tmp/lila-gif fetch --depth=1 https://github.com/lichess-org/lila-gif.git a92511ae3be69c0c0a4002c39fa6cf92f4c93768
          git -C /tmp/lila-gif checkout --detach FETCH_HEAD
          python deploy/public/gif-renderer.py prepare /tmp/lila-gif /tmp/mute-gif-artifact
          python deploy/public/gif-renderer.py verify /tmp/mute-gif-artifact
          python deploy/public/smoke-gif-renderer.py /tmp/mute-gif-artifact/lila-gif /tmp/mute-gif-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-gif-qualified
          path: |
            /tmp/mute-gif-artifact
            /tmp/mute-gif-smoke
          if-no-files-found: error
          retention-days: 7
